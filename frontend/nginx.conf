server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same relative-path /api pattern as the local Vite dev proxy, so the
    # frontend code doesn't need to know whether it's talking to
    # localhost:8000 (dev) or the `api` service (docker-compose).
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
